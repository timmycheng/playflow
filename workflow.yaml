# ============================================================================
#  playflow 工作流模板（把「内网…」占位替换成实际地址即可）
# ----------------------------------------------------------------------------
#  运行：  playflow run workflow.yaml
#  校验：  playflow validate workflow.yaml
#
#  怎么快速把页面变成步骤？
#    playflow probe  --workflow workflow.yaml   登录后人工浏览，回车扫描元素；
#                                                w=文件.yaml 保存选择器与步骤草稿
#    playflow record out.yaml --workflow workflow.yaml
#                                               在浏览器里点一遍，自动生成 YAML
#
#  设计要点
#   * 一切皆 step：{uses, name, with, if, id, continue_on_error}
#   * 变量用 {{ name }} 引用，支持点路径 {{ row.no }}、{{ steps.xxx }}
#   * 循环：for_each / while / repeat，循环体写在 do: 下
#   * 条件：字符串表达式或结构化映射，见 README「条件与函数」一节
#   * tasks 三种模式：first_row（默认，队列取第一行）/ once（只跑一次）/
#     each_row（表格逐行；remove_after: false 时按行号依次处理）
# ============================================================================

name: 我的工作流

# ---------- 引擎设置（均可省略） ----------
settings:
  max_tasks: 1                  # 每个任务处理条数；先 1 条试跑
  screenshot: true              # 关键动作截图到 shots/
  task_delay_seconds: [1, 3]    # 每条之间随机等待秒数
  attachment_dir: 附件           # 附件保存根目录
  # dialog: accept              # 原生弹窗策略：accept（默认）/ dismiss
  # dialog_text: ""             # dialog: prompt 时的输入文本
  # timeout: 20000              # 元素默认超时（毫秒）

# ---------- 浏览器（省略时 channel=chrome, headless=false） ----------
browser:
  channel: chrome               # 驱动系统 Chrome；也可用 msedge
  headless: false

# ---------- 登录（可选；不需要登录的流程可整段删除） ----------
# 登录态复用：成功后写入 state.json，有效期内再次运行不再触碰人工验证环节。
login:
  url: http://内网SSO地址/login
  username: 工号或账号
  password: "密码"              # 可用 {{ env.password }} 从 env 引用
  # username_selector: "input[name='username']"   # 可省略，自动找第一个文本框
  # password_selector: "input[name='password']"
  button_text: [登录, 登 录]
  manual_pause: true            # 点登录后暂停等人处理 UKey/短信，回车继续
  pause_hint: 请在 UKey 窗口完成验证后按回车
  success_url: http://内网平台地址/home
  # verify_url: ...             # 校验登录成功的地址（默认取 success_url）
  # state_file: state.json      # 不同流程可各留一份登录态
  # steps: [...]                # 登录页很特殊时，用自定义步骤替代上面简写

# ---------- 变量（步骤里用 {{ 名字 }} 引用） ----------
env:
  operator: 自动处理

# ---------- 主流程：登录后、逐任务之前执行一次 ----------
steps:
  - name: 打开平台首页
    uses: goto
    with: { url: "http://内网平台地址/home" }

# ---------- 任务（按需增删；每个任务是列表循环或单页流程） ----------
tasks:
  # ---- 示例一：队列式列表（处理完的行会消失；默认 first_row） ----
  - name: 待办列表
    url: http://内网平台地址/list?type=1
    label_regex: '[A-Za-z]{1,6}-?\d{2,}'    # 从行文本提取任务号，用作汇总标签
    steps:
      - name: 打开任务（新标签页或同页跳转都兼容）
        uses: click_row_link

      - name: 提取正文，供条件判断
        uses: evaluate
        with: { js: "() => document.body.innerText", name: body_text }

      - name: 签收任务（找不到就跳过，兼容已签收）
        uses: click_text
        with: { text: [签收, 受理], optional: true }

      - name: 按类型勾选处理意见（命中“申请”则驳回）
        uses: pick_radio
        with: { text: 驳回 }
        if: "body_text contains 申请"

      - name: 其余默认同意
        uses: pick_radio
        with: { text: 同意 }
        if: "body_text not contains 申请"

      - name: 下载附件
        uses: download
        with: { optional: true }

      - name: 提交（原生 confirm 自动确认）
        uses: click_text
        with: { text: [提交, 确定] }

      - name: 关闭任务标签页，回到列表
        uses: close_task_page

  # ---- 示例二：单页流程（无列表，只执行一次） ----
