# ============================================================================
#  workflow.advanced.yaml —— 高级手法参考（通用，占位地址请自行替换）
# ----------------------------------------------------------------------------
#  当页面比"标准列表 + 详情页"更复杂时，用本文件演示的手法适配：
#   1. iframe 定向：frame: "#1" / frame: main / frame: "list2"
#   2. 条件分支：if + then/else，或 exists()/visible()/has_text()
#   3. 循环：for_each 遍历表格行、repeat 重试、while 轮询
#   4. 多标签页：switch_page / goto new_tab 在页面间切换
#   5. 精确选择器兜底：click / fill / wait_for
#   6. 失败容忍：optional / continue_on_error / assert
#   7. 自定义登录：login.steps 应对奇怪登录页
#   8. 取数/接口：extract / evaluate / request 把页面与接口数据存成变量
#   9. 弹窗策略：settings.dialog 或 set_dialog 动作
#  10. 探测与录制：probe / record 动作直接在流程里产出 YAML 草稿
#
#  运行：  tool_kit --workflow workflow.advanced.yaml
# ============================================================================

name: 高级手法演示

settings:
  max_tasks: 1
  screenshot: true
  task_delay_seconds: [1, 3]
  dialog: accept                 # 原生弹窗默认接受；要取消改 dismiss
  # radio_rules 见 workflow.yaml 模板

browser:
  channel: chrome
  headless: false

# ---------- 自定义登录：登录页很怪时用 login.steps ----------
# 普通账密 + UKey 的写法见 workflow.yaml 模板；这里演示整段自定义。
login:
  steps:
    - uses: goto
      with: { url: "http://内网SSO地址/login" }
    - uses: fill
      with: { placeholder: 用户名, text: "{{ env.username }}" }
    - uses: fill
      with: { selector: "input[type='password']", text: "{{ env.password }}", secret: true }
    - uses: click_text
      with: { text: [登录, 登 录] }
    - uses: pause                    # UKey 半自动暂停；无 UKey 可删掉
      with: { message: "请完成 UKey 验证后回车" }
    - uses: wait_for
      with: { selector: "body", timeout: 15000 }
  success_url: http://内网平台地址/home

env:
  username: 工号或账号
  password: ""
  retry_times: 3

# ---------- 主流程：演示条件、循环、iframe、取数、接口 ----------
steps:
  - name: 打开平台首页
    uses: goto
    with: { url: "http://内网平台地址/home" }

  - name: 等待首页关键文字（页面异步渲染时很有用）
    uses: wait_for
    with: { selector: "text=任务平台", timeout: 15000 }
    continue_on_error: true

  - name: 首页若弹出公告则关闭（条件步骤，不存在就跳过）
    uses: if
    with:
      condition: "exists(button:has-text('关闭公告'))"
    then:
      - uses: click_text
        with: { text: [关闭公告, 关闭], optional: true }

  - name: 演示循环：打印首页所有链接文字
    uses: for_each
    with:
      rows: "a[href]"          # 按选择器遍历元素文本
    do:
      - uses: log
        with: { message: "首页链接：{{ item }}" }

  - name: 演示 while 轮询：最多等 5 次，直到出现入口
    uses: while
    with:
      condition: "n < 5 and not exists(a:has-text('待办'))"
      max: 5
      as: n
    do:
      - uses: wait
        with: { ms: 500 }

  - name: 断言入口已就绪
    uses: assert
    with: { condition: "exists(a:has-text('待办'))", message: "首页应有功能入口" }

  - name: 演示取数：把页面数据存成变量（extract / evaluate / text() 条件）
    uses: extract
    with:
      selector: "h1"
      what: text
      name: page_h1
    continue_on_error: true

  - name: 演示接口取数（HTTP 请求存变量，不经过浏览器）
    uses: request
    with: { url: "http://内网平台地址/api/status", name: http, timeout: 10 }
    continue_on_error: true

  - name: 演示条件函数 count/text
    uses: assert
    with:
      condition: "count(a[href]) >= 1 and text(h1) != ''"
      message: "首页至少有一个链接和标题"
    continue_on_error: true

tasks:
  # ---- iframe 列表（工具自动遍历所有 frame，定向时用 frame:） ----
  - name: iframe 列表
    url: http://内网平台地址/list2_page
    steps:
      - name: 先确认 iframe 已加载
        uses: wait_for
        with: { selector: "table", frame: "#1", timeout: 15000 }

      - name: 在 iframe 内点击第一行任务链接
        uses: click_row_link

      - name: 签收（找不到就继续，兼容已签收）
        uses: click_text
        with: { text: [签收, 受理], optional: true }

      - name: 若详情页是新开标签页则记录（多标签页判断）
        uses: log
        if: "page_count() > 1"
        with: { message: "检测到多标签页，任务号 {{ task_no }}" }

      - name: 按规则选 radio（结果存入变量，便于断言/引用）
        uses: pick_radio_by_rule
        id: picked
        continue_on_error: true

      - name: 记录最终选中的处理意见
        uses: log
        with: { message: "规则命中结果：{{ steps.picked }}" }

      - uses: download
        with: { optional: true }

      - uses: click_text
        with: { text: [提交, 确定] }

      - name: 重试等待"提交成功"，最多 3 次
        uses: repeat
        with: { times: "{{ retry_times }}" }
        do:
          - uses: if
            with: { condition: "has_text(提交成功)" }
            then:
              - uses: break
            else:
              - uses: wait
                with: { ms: 500 }

      - uses: close_task_page

  # ---- 单页取数流程：把接口数据落盘 + 截图存档 ----
  - name: 单页取数
    mode: once
    steps:
      - uses: goto
        with: { url: "http://内网平台地址/usage" }
      - name: 保存接口 JSON 到 附件/接口.json（便于离线核对）
        uses: request
        with:
          url: "http://内网平台地址/api/usage"
          output: "附件/接口.json"
          name: usage
        continue_on_error: true
      - uses: screenshot
        with: { name: 用量页面 }
