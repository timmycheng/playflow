# ============================================================================
#  workflow.yaml —— 类 GitHub Actions 的任务自动化流程（示例，指向本地 mock 平台）
# ----------------------------------------------------------------------------
#  运行：  tool_kit.exe --workflow workflow.yaml      （或菜单选 5）
#  校验：  tool_kit.exe --workflow workflow.yaml --validate
#
#  说明：workflow 模式不要求 config.json——login / settings 都写在 YAML 里即可；
#        同目录若存在 config.json，仅作为没写到的项的兜底。
#
#  设计要点
#   * 一切皆 step：每个步骤是 {uses, name, with, if, id, continue_on_error}
#   * uses 决定动作；with 是参数；if 是条件；id 把结果存进变量
#   * 变量用 {{ name }} 引用，支持点路径 {{ row.no }}
#   * 循环：for_each / while / repeat，循环体写在 do: 下
#   * 分支：if: <条件> 配合 then: / else:
#   * tasks 是"列表循环"：工具自动"永远取列表第一行 → 跑 steps → reload"，不用你写循环
#
#  页面复杂怎么办？
#   * 优先用高层动作（click_text / pick_radio_by_rule / click_row_link / download），
#     它们自带：中文文字容错空格、遍历所有 iframe、穿透 Shadow DOM、新标签页兼容
#   * 某个页面结构特殊时，再叠加低层动作（click / fill / wait_for / switch_page）
#     用精确选择器或用 frame 指定 iframe
# ============================================================================

name: 内网任务处理流程（mock 示例）

# ---------- 引擎级设置（都可省略，省略时取 config.json 的值） ----------
settings:
  max_tasks: 1                  # 每类处理条数；先 1 条试跑，验证后可调大
  attachment_dir: 附件          # 附件保存根目录（相对路径锚定到 exe 目录）
  download_attachments: true
  task_delay_seconds: [1, 3]    # 每条任务之间随机等待秒数
  screenshot: true              # 关键动作自动截图
  sign_keywords: [签收, 受理, 确认]
  submit_keywords: [提交, 确定, 保存]
  default_radio: 同意
  radio_rules:                  # 任务类型 → 单选框（按顺序匹配，命中即用）
    - if_type_contains: 报修
      then_pick: 同意
    - if_type_contains: 故障
      then_pick: 同意
    - if_type_contains: 申请
      then_pick: 驳回

# ---------- 浏览器 ----------
browser:
  channel: chrome
  headless: false

# ---------- 登录 ----------
# 真实 SSO 与 mock 通用写法：给按钮文字即可，工具自动填账密、点登录、暂停等 UKey。
# 若登录页元素很怪，可改用 steps 自定义（注释里的写法）。
login:
  url: http://127.0.0.1:8899/login
  username: admin
  password: "123456"
  username_selector: "input[name='username']"   # 可省略，省略时自动找第一个文本框
  password_selector: "input[name='password']"
  button_text: [登录, 登 录]
  wait_after_login_ms: 500        # 点登录后等待，兼容 JS 跳转
  ukey_wait: true                 # true=暂停等人工完成 UKey（真实环境必须 true）
  success_url: http://127.0.0.1:8899/home   # 登录后访问它校验登录态并保存 state.json
  # steps:                        # 若上面的通用流程不适配，可整段自定义：
  #   - uses: goto
  #     with: { url: "http://sso/login" }
  #   - uses: fill
  #     with: { placeholder: 用户名, text: "{{ env.username }}" }
  #   - uses: fill
  #     with: { placeholder: 密码, text: "{{ env.password }}" }
  #   - uses: click_text
  #     with: { text: 登录 }
  #   - uses: pause
  #     with: { message: "请完成 UKey 验证后回车" }

# ---------- 变量（可在步骤里用 {{ 名字 }} 引用） ----------
env:
  platform: 内网任务平台
  operator: 自动处理

# ---------- 主流程：登录后、逐个类别之前执行一次 ----------
steps:
  - name: 打印平台信息
    uses: log
    with:
      message: "开始处理平台【{{ platform }}】，操作人：{{ operator }}"

  - name: 确认已进入平台首页
    uses: expect_text
    with:
      text: 任务处理平台
    continue_on_error: true       # 页面文案不同也不致命

# ---------- 任务类别：每个类别自动"取列表第一行 → 跑 steps → 回到列表" ----------
tasks:
  # ===== 类别一：普通列表页 =====
  - name: 类别一
    url: http://127.0.0.1:8899/list1_page
    steps:
      - name: 打开任务（新标签页或同页跳转都兼容）
        uses: click_row_link

      - name: 从行文本解析任务号
        uses: parse_var
        with:
          from: "{{ row_text }}"
          regex: "[A-Za-z]{1,6}-?\\d{2,}"
          name: task_no
          default: 未知任务

      - name: 签收任务（找不到就跳过，兼容已签收）
        uses: click_text
        with:
          text: [签收, 受理]
          optional: true

      - name: 按任务类型勾选处理意见
        uses: pick_radio_by_rule

      - name: 下载附件
        uses: download
        if: "{{ settings.download_attachments }}"   # 也可写 download_attachments
        with:
          optional: true

      - name: 提交（原生 confirm 自动确认）
        uses: click_text
        with:
          text: [提交, 确定]

      - name: 断言提交完成
        uses: expect_text
        with:
          text: 提交成功
        continue_on_error: true

      - name: 关闭任务标签页
        uses: close_task_page

  # ===== 类别二：列表在 iframe 里（工具自动遍历，无需特殊处理） =====
  - name: 类别二
    url: http://127.0.0.1:8899/list2_page
    steps:
      - uses: click_row_link
      - uses: click_text
        with: { text: [签收, 受理], optional: true }
      - uses: pick_radio_by_rule
      - uses: download
        with: { optional: true }
      - uses: click_text
        with: { text: [提交, 确定] }
      - uses: close_task_page
